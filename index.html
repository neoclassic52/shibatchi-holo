<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>シバッチ ホロシール</title>
<meta name="description" content="シバッチをビックリマン風のプリズム／ホログラムシールに。マウスや指で傾けると光が流れます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #0b0c14;
    --ground-glow: #1c2040;
    --panel: #161827;
    --line: #272b44;
    --ink: #eef0fb;
    --muted: #979dc2;
    --ribbon: #e8264f;
    --cyan: #49b8d6;
  }
  body {
    background: radial-gradient(ellipse 80% 55% at 50% 38%, var(--ground-glow) 0%, var(--ground) 70%) var(--ground);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    min-height: 100vh;
  }
  .stage {
    max-width: 640px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 28px 36px;
    box-sizing: border-box;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 22px;
  }
  header { text-align: center; }
  .eyebrow {
    margin: 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .22em;
    color: var(--muted);
  }
  h1 {
    margin: 6px 0 0;
    font-family: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-weight: 400;
    font-size: clamp(30px, 8vw, 44px);
    line-height: 1.15;
    text-wrap: balance;
  }
  h1 .tag {
    display: inline-block;
    margin-left: .35em;
    padding: .18em .6em .22em;
    font-size: .42em;
    vertical-align: middle;
    background: var(--ribbon);
    color: #fff;
    border-radius: 3px;
    transform: rotate(-4deg);
  }

  .scene {
    width: min(100%, 440px);
    perspective: 1200px;
  }
  /* .card = 傾き担当、.flipper = 裏返し担当、.face = 表と裏の面 */
  .card {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 1;
    transform-style: preserve-3d;
    will-change: transform;
    touch-action: none;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .flipper {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform .9s cubic-bezier(.3, .7, .2, 1);
  }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 4.5%;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow:
      0 34px 50px -22px rgba(0, 0, 0, .85),
      0 0 0 1px rgba(255, 255, 255, .07);
  }
  .card:focus-visible .face {
    box-shadow:
      0 34px 50px -22px rgba(0, 0, 0, .85),
      0 0 0 3px var(--cyan);
  }
  .front { background: #cfd2d8; }
  .back {
    background: #f4efa6;
    transform: rotateY(180deg);
  }
  .face > * {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .back .glare { opacity: .45; }
  .face .figure {
    transform: translate(var(--px, 0), var(--py, 0)) scale(.94);
  }
  .glare {
    background: radial-gradient(circle at var(--gx, 60%) var(--gy, 35%),
      rgba(255, 255, 255, .55) 0%,
      rgba(255, 255, 255, .14) 28%,
      rgba(0, 0, 0, .22) 85%);
    mix-blend-mode: overlay;
    opacity: var(--glare, .9);
  }
  .edge {
    border-radius: inherit;
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, .28),
      inset 0 0 22px rgba(0, 0, 0, .3);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  .flip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 12px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color .2s;
  }
  .flip:hover { border-color: var(--muted); }
  .flip:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
  .flip svg { width: 16px; height: 16px; }
  @media (prefers-reduced-motion: reduce) {
    .flipper { transition-duration: .01s; }
  }
  .modes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    padding: 4px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .modes button {
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    color: var(--muted);
    background: transparent;
    border: 0;
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: color .2s, background-color .2s;
  }
  .modes button:hover { color: var(--ink); }
  .modes button[aria-pressed="true"] {
    color: #10121c;
    background: linear-gradient(100deg, #8ff0ff, #b9ffa0 30%, #fff390 55%, #ffb88c 78%, #dcaaff);
  }
  .modes button:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
  .hint {
    margin: 0;
    max-width: 34em;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
    text-align: center;
  }
  .hint b { color: var(--ink); font-weight: 700; }
  footer {
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--muted);
    opacity: .7;
  }
</style>

</head>

<script>
(() => {
  const card = document.getElementById('card');
  const bg = document.getElementById('bg');
  const fig = document.getElementById('fig');
  const charImg = document.getElementById('char');
  const bctx = bg.getContext('2d');
  const fctx = fig.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FIG_SCALE = 0.94;

  // 傾きの状態（-1〜1）。t=目標、c=現在（なめらかに追従）
  const S = { tx: 0.35, ty: -0.25, cx: 0.35, cy: -0.25, last: -1e9 };
  let mode = 'prism';
  let dirty = true;
  let W = 0;

  // ---------- 乱数（毎回同じ配置にする） ----------
  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = rng(20260923);

  // ---------- プリズム（格子状のピラミッド面） ----------
  const N = 14;
  const phase = Array.from({ length: N * N }, () => rand());
  // 4つの面の向きと、静止時の陰影
  const FACETS = [[0, -1, 16], [1, 0, -6], [0, 1, -16], [-1, 0, 6]];

  function drawPrism(lx, ly) {
    const ts = W / N;
    const len = Math.hypot(lx, ly);
    const nx = lx / (len || 1), ny = ly / (len || 1);
    const strength = Math.min(1, len * 1.4);
    const spotX = W * (0.5 + lx * 0.6), spotY = W * (0.5 + ly * 0.6);
    const sig2 = 2 * (W * 0.4) ** 2;

    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        const x0 = i * ts, y0 = j * ts, x1 = x0 + ts, y1 = y0 + ts;
        const mx = x0 + ts / 2, my = y0 + ts / 2;
        const dx = mx - spotX, dy = my - spotY;
        const g = Math.exp(-(dx * dx + dy * dy) / sig2);
        const ph = phase[j * N + i];
        for (let f = 0; f < 4; f++) {
          const [fx, fy, base] = FACETS[f];
          const facing = fx * nx + fy * ny;
          let hue = facing * 0.55 * strength + i * 0.05 + j * 0.08 + lx * 0.6 - ly * 0.45 + ph * 0.12;
          hue = (hue - Math.floor(hue)) * 360;
          const k = Math.min(1, 0.12 + g * (0.4 + 0.6 * Math.max(0, facing)) * (0.35 + 0.65 * strength));
          const sat = 8 + 88 * k;
          let light = 62 + base * (1 - k * 0.5) + facing * strength * 14 + g * 12;
          light = Math.max(28, Math.min(94, light));
          bctx.fillStyle = `hsl(${hue.toFixed(1)},${sat.toFixed(1)}%,${light.toFixed(1)}%)`;
          bctx.beginPath();
          bctx.moveTo(mx, my);
          if (f === 0) { bctx.lineTo(x0, y0); bctx.lineTo(x1, y0); }
          else if (f === 1) { bctx.lineTo(x1, y0); bctx.lineTo(x1, y1); }
          else if (f === 2) { bctx.lineTo(x1, y1); bctx.lineTo(x0, y1); }
          else { bctx.lineTo(x0, y1); bctx.lineTo(x0, y0); }
          bctx.closePath();
          bctx.fill();
        }
      }
    }
    // 格子の継ぎ目
    bctx.strokeStyle = 'rgba(30,32,44,.28)';
    bctx.lineWidth = Math.max(1, W / 700);
    bctx.beginPath();
    for (let i = 1; i < N; i++) {
      const p = Math.round(i * ts) + .5;
      bctx.moveTo(p, 0); bctx.lineTo(p, W);
      bctx.moveTo(0, p); bctx.lineTo(W, p);
    }
    bctx.stroke();
    // 斜めに走る光の帯
    const p = 0.5 + (lx + ly) * 0.42;
    const grad = bctx.createLinearGradient(0, 0, W, W);
    const st = (o, a) => grad.addColorStop(Math.max(0, Math.min(1, p + o)), `rgba(255,255,255,${a})`);
    st(-0.22, 0); st(0, 0.42); st(0.22, 0);
    bctx.globalCompositeOperation = 'screen';
    bctx.fillStyle = grad;
    bctx.fillRect(0, 0, W, W);
    bctx.globalCompositeOperation = 'source-over';
  }

  // ---------- ホログラム ----------
  let R = 0, A, H0, I, out;
  const LUT = new Uint8ClampedArray(1024 * 3);
  (function buildLut() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 1;
    const x = c.getContext('2d');
    for (let i = 0; i < 1024; i++) {
      x.fillStyle = `hsl(${i / 1024 * 360},100%,60%)`;
      x.fillRect(i, 0, 1, 1);
    }
    const d = x.getImageData(0, 0, 1024, 1).data;
    for (let i = 0; i < 1024; i++) {
      // 少し白を混ぜてホログラムらしいパステル寄りに
      LUT[i * 3] = d[i * 4] * 0.88 + 30;
      LUT[i * 3 + 1] = d[i * 4 + 1] * 0.88 + 30;
      LUT[i * 3 + 2] = d[i * 4 + 2] * 0.88 + 30;
    }
  })();

  function buildHolo(size) {
    R = size;
    fig.width = fig.height = R;
    const c = document.createElement('canvas');
    c.width = c.height = R;
    const x = c.getContext('2d');
    x.drawImage(charImg, 0, 0, R, R);
    const d = x.getImageData(0, 0, R, R).data;
    A = new Uint8Array(R * R);
    H0 = new Float32Array(R * R);
    I = new Float32Array(R * R);
    for (let p = 0; p < R * R; p++) {
      const q = p * 4, a = d[q + 3];
      A[p] = a;
      if (!a) continue;
      const r = d[q], g = d[q + 1], b = d[q + 2];
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
      const Y = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      let hue = 0;
      if (mx - mn > 12) {
        const cdel = mx - mn;
        if (mx === r) hue = ((g - b) / cdel + 6) % 6;
        else if (mx === g) hue = (b - r) / cdel + 2;
        else hue = (r - g) / cdel + 4;
        hue /= 6;
      }
      const yy = (p / R | 0) / R, xx = (p % R) / R;
      H0[p] = yy * 0.55 + xx * 0.2 + hue * 0.35 + (1 - Y) * 0.15;
      // 暗い線は黒く抜き、明るい面ほど強く光る
      let t = (Y - 0.1) / 0.18;
      t = t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
      I[p] = t * (0.6 + 0.5 * Y);
    }
    out = fctx.createImageData(R, R);
    buildStars(d);
  }

  let stars = [];
  function buildStars(d) {
    const r2 = rng(777);
    const alphaAt = (u, v) => {
      // シール上の座標 → キャラ画像上の座標（縮小ぶんを戻す）
      const cu = (u - 0.5) / FIG_SCALE + 0.5, cv = (v - 0.5) / FIG_SCALE + 0.5;
      if (cu < 0 || cu >= 1 || cv < 0 || cv >= 1) return 0;
      return d[((cv * R | 0) * R + (cu * R | 0)) * 4 + 3];
    };
    stars = [];
    let tries = 0;
    while (stars.length < 190 && tries++ < 6000) {
      const u = 0.03 + r2() * 0.94, v = 0.03 + r2() * 0.94;
      const m = 0.028;
      if (alphaAt(u, v) || alphaAt(u + m, v) || alphaAt(u - m, v) || alphaAt(u, v + m) || alphaAt(u, v - m)) continue;
      const kind = r2() < 0.62 ? 'star' : 'dash';
      stars.push({ u, v, kind, size: 0.006 + r2() * r2() * 0.014, rot: r2() * Math.PI, seed: r2() });
    }
  }

  function starPath(x, y, r, rot) {
    bctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = rot + k * Math.PI / 5;
      const rr = k % 2 ? r * 0.45 : r;
      bctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    bctx.closePath();
  }

  function drawHoloBg(lx, ly) {
    bctx.fillStyle = '#05060b';
    bctx.fillRect(0, 0, W, W);
    // 光源付近のにじみ
    const sx = W * (0.5 + lx * 0.6), sy = W * (0.5 + ly * 0.6);
    const glow = bctx.createRadialGradient(sx, sy, 0, sx, sy, W * 0.7);
    glow.addColorStop(0, 'rgba(120,200,255,.16)');
    glow.addColorStop(0.5, 'rgba(180,120,255,.06)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    bctx.fillStyle = glow;
    bctx.fillRect(0, 0, W, W);

    for (const s of stars) {
      let h = s.v * 0.7 + s.u * 0.25 + lx * 0.5 + ly * 0.35 + s.seed * 0.12;
      h = (h - Math.floor(h)) * 360;
      const tw = 0.3 + 0.7 * Math.max(0, Math.cos(s.seed * 6.283 + lx * 4 + ly * 3));
      bctx.fillStyle = `hsl(${h.toFixed(1)},95%,${(22 + 50 * tw).toFixed(1)}%)`;
      const x = s.u * W, y = s.v * W, r = s.size * W;
      if (s.kind === 'star') {
        starPath(x, y, r, s.rot);
        bctx.fill();
      } else {
        bctx.fillRect(x - r, y - r * 0.2, r * 2, r * 0.4);
      }
    }
  }

  function drawHoloFigure(lx, ly) {
    const data = out.data;
    const sx = R * (0.5 + lx * 0.6), sy = R * (0.5 + ly * 0.6);
    const inv = 1 / (R * R * 0.5);
    const shift = lx * 0.45 + ly * 0.3;
    const kx = lx * 0.35 / R, ky = ly * 0.35 / R;
    const stripe = Math.max(2, Math.round(R / 240));
    for (let y = 0, p = 0; y < R; y++) {
      const band = (y % (stripe * 2)) < stripe ? 1 : 0.82;
      const dy = y - sy;
      for (let x = 0; x < R; x++, p++) {
        const q = p * 4;
        const a = A[p];
        if (!a) { data[q + 3] = 0; continue; }
        let h = H0[p] + shift + x * kx + y * ky;
        h -= Math.floor(h);
        const li = ((h * 1023) | 0) * 3;
        const dx = x - sx;
        let sp = 1 - (dx * dx + dy * dy) * inv;
        if (sp < 0) sp = 0;
        let b = I[p] * (0.68 + 0.6 * sp) * band;
        if (b > 1) b = 1;
        data[q] = LUT[li] * b;
        data[q + 1] = LUT[li + 1] * b;
        data[q + 2] = LUT[li + 2] * b;
        data[q + 3] = a;
      }
    }
    fctx.putImageData(out, 0, 0);
  }

  // ---------- ノーマル（天使シールの銀地） ----------
  let grain = null;
  function buildGrain() {
    // 銀紙の細かいヘアライン（横方向にのびたザラつき）
    const c = document.createElement('canvas');
    c.width = c.height = W;
    const x = c.getContext('2d');
    const img = x.createImageData(W, W);
    const d = img.data;
    const r = rng(99);
    for (let y = 0, q = 0; y < W; y++) {
      let v = r() * 255;
      for (let xx = 0; xx < W; xx++, q += 4) {
        v = v * 0.9 + r() * 255 * 0.1;
        const n = v * 0.7 + r() * 255 * 0.3;
        d[q] = d[q + 1] = d[q + 2] = n;
        d[q + 3] = 255;
      }
    }
    x.putImageData(img, 0, 0);
    grain = c;
  }

  function drawSilver(lx, ly) {
    // 傾きに合わせて明暗の帯が流れる金属グラデーション
    const off = lx * 0.35 + ly * 0.25;
    const g = bctx.createLinearGradient(0, 0, W * 0.8, W);
    const STEPS = 28;
    for (let k = 0; k <= STEPS; k++) {
      const t = k / STEPS;
      const b = 0.66
        + 0.22 * Math.sin(2 * Math.PI * (t * 1.5 + off))
        + 0.1 * Math.sin(2 * Math.PI * (t * 3.4 - off * 1.7));
      const v = Math.max(0, Math.min(255, b * 255));
      g.addColorStop(t, `rgb(${(v - 5) | 0},${(v - 1) | 0},${Math.min(255, v + 5) | 0})`);
    }
    bctx.fillStyle = g;
    bctx.fillRect(0, 0, W, W);

    // 光源の照り返し
    const sx = W * (0.5 + lx * 0.6), sy = W * (0.5 + ly * 0.6);
    const hot = bctx.createRadialGradient(sx, sy, 0, sx, sy, W * 0.55);
    hot.addColorStop(0, 'rgba(255,255,255,.75)');
    hot.addColorStop(0.35, 'rgba(255,255,255,.25)');
    hot.addColorStop(1, 'rgba(255,255,255,0)');
    bctx.globalCompositeOperation = 'screen';
    bctx.fillStyle = hot;
    bctx.fillRect(0, 0, W, W);

    // ヘアラインの質感
    if (grain) {
      bctx.globalCompositeOperation = 'overlay';
      bctx.globalAlpha = 0.22;
      bctx.drawImage(grain, 0, 0);
      bctx.globalAlpha = 1;
    }
    bctx.globalCompositeOperation = 'source-over';
  }

  // ---------- 描画 ----------
  function render() {
    const lx = S.cx, ly = S.cy;
    card.style.transform = `rotateX(${(-ly * 28).toFixed(2)}deg) rotateY(${(lx * 32).toFixed(2)}deg)`;
    card.style.setProperty('--gx', `${(50 + lx * 45).toFixed(1)}%`);
    card.style.setProperty('--gy', `${(50 + ly * 45).toFixed(1)}%`);
    card.style.setProperty('--px', `${(lx * 2.6).toFixed(2)}%`);
    card.style.setProperty('--py', `${(ly * 2.6).toFixed(2)}%`);
    // 裏返している間は表の絵を描き直さない（スマホの負担を減らす）
    if (!W || (turns % 2 && !flipAnimating)) return;
    if (mode === 'prism') drawPrism(lx, ly);
    else if (mode === 'holo') { drawHoloBg(lx, ly); if (R) drawHoloFigure(lx, ly); }
    else drawSilver(lx, ly);
  }

  function frame(t) {
    const idle = t - S.last > 2500;
    if (idle && !reduceMotion) {
      // 触っていないときはゆらゆら揺れる
      S.tx = Math.sin(t * 0.0007) * 0.6;
      S.ty = Math.sin(t * 0.00053 + 1) * 0.45;
    }
    const k = idle ? 0.05 : 0.14;
    const ox = S.cx, oy = S.cy;
    S.cx += (S.tx - S.cx) * k;
    S.cy += (S.ty - S.cy) * k;
    if (dirty || Math.abs(S.cx - ox) + Math.abs(S.cy - oy) > 0.0004) {
      dirty = false;
      render();
    }
    requestAnimationFrame(frame);
  }

  // ---------- 入力 ----------
  const clamp = v => Math.max(-1, Math.min(1, v));
  function aim(e) {
    const r = card.getBoundingClientRect();
    // 指はシールの上しか動かせないので、マウスより敏感にする
    const reach = e.pointerType === 'mouse' ? 0.75 : 0.4;
    S.tx = clamp((e.clientX - (r.left + r.width / 2)) / (r.width * reach));
    S.ty = clamp((e.clientY - (r.top + r.height / 2)) / (r.height * reach));
    S.last = performance.now();
  }
  window.addEventListener('pointermove', aim);
  document.documentElement.addEventListener('pointerleave', () => { S.tx = 0; S.ty = 0; });

  // ---------- 裏返し ----------
  const flipper = document.getElementById('flipper');
  const flipLabel = document.getElementById('flip-label');
  let turns = 0;               // 半回転した回数（奇数なら裏）
  let flipAnimating = false;
  let flipTimer = 0;
  function flip() {
    turns++;
    // いつも同じ向きにくるっと回す
    flipper.style.transform = `rotateY(${turns * 180}deg)`;
    flipLabel.textContent = turns % 2 ? 'おもてを見る' : 'うらを見る';
    flipAnimating = true;
    dirty = true;
    clearTimeout(flipTimer);
    flipTimer = setTimeout(() => { flipAnimating = false; }, 950);
  }
  document.getElementById('flip').addEventListener('click', flip);

  // タップ（ほとんど動かさずに離す）なら裏返す。なぞっただけなら傾けるだけ
  let down = null;
  card.addEventListener('pointerdown', e => {
    aim(e);
    down = { x: e.clientX, y: e.clientY, t: performance.now() };
  });
  card.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    const quick = performance.now() - down.t < 450;
    down = null;
    if (moved < 12 && quick) flip();
  });
  card.addEventListener('pointercancel', () => { down = null; });

  card.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      flip();
      return;
    }
    const step = 0.2;
    const map = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    const m = map[e.key];
    if (!m) return;
    e.preventDefault();
    S.tx = clamp(S.cx + m[0]);
    S.ty = clamp(S.cy + m[1]);
    S.last = performance.now();
  });

  // ---------- モード切替 ----------
  const buttons = [...document.querySelectorAll('.modes button')];
  function setMode(m, fromUser) {
    mode = m;
    // 裏を見ているときに種類を選んだら、表に戻して見せる
    if (fromUser && turns % 2) flip();
    buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    charImg.hidden = m === 'holo';
    fig.hidden = m !== 'holo';
    card.style.setProperty('--glare', m === 'normal' ? '.75' : '.9');
    try { localStorage.setItem('shibatchi-holo-mode', m); } catch (_) {}
    dirty = true;
  }
  buttons.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode, true)));
  try {
    const saved = localStorage.getItem('shibatchi-holo-mode');
    if (saved === 'normal' || saved === 'prism' || saved === 'holo') setMode(saved);
  } catch (_) {}

  // ---------- サイズ ----------
  function resize() {
    const w = card.getBoundingClientRect().width;
    const dpr = window.devicePixelRatio || 1;
    const nw = Math.min(1100, Math.round(w * dpr));
    if (nw && nw !== W) {
      W = bg.width = bg.height = nw;
      buildGrain();
      const nr = Math.min(W, 720);
      if (charImg.complete && charImg.naturalWidth && nr !== R) buildHolo(nr);
      dirty = true;
    }
  }
  new ResizeObserver(resize).observe(card);
  const ready = () => { R = 0; W = 0; resize(); };
  if (charImg.complete && charImg.naturalWidth) ready();
  else charImg.addEventListener('load', ready, { once: true });

  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
